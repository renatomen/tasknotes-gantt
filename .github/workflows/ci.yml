name: CI

on:
  pull_request:

# Least privilege: jobs only read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the maintainability trend measures a churn window from
          # a fixed baseline commit, which a shallow clone cannot reach.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        # --ignore-scripts: supply-chain hardening; native deps (rollup/esbuild/
        # @swc) are optionalDependencies, not install scripts, so build is unaffected.
        run: npm ci --ignore-scripts
      - name: Assert manifest is a clean release version (no prerelease suffix on main)
        # A `-beta` manifest must never merge to main: it is the store-facing
        # version. Betas are cut on a tag, not on main. Mechanical guard for the
        # manifest-on-main invariant (see docs/releases/RELEASING.md), per "enforce always-X
        # with a mechanism, not memory".
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::manifest.json version '$VERSION' is not a clean release version (X.Y.Z). A prerelease manifest must not merge to main."
            exit 1
          fi
      - name: Assert the release index is up to date
        # docs/releases.md is generated from docs/releases/*.md. A notes PR that
        # adds a version file but forgets to refresh the index leaves the public
        # release index on main stale (RELEASING.md Step 1) — a recurring slip.
        # Mechanical guard, per "enforce always-X with a mechanism, not memory":
        # regenerate locally with `node scripts/update-release-index.mjs`.
        run: node scripts/update-release-index.mjs --check
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Unit tests
        run: npm test --if-present
      - name: Maintainability trend
        # Runs on every PR, failing ones included (if: always(), deliberately
        # not continue-on-error): the measured values never fail the step, only
        # a crash does. The merge-base comes from the PR event's own base/head
        # shas — never github.sha, which is the synthetic merge ref.
        if: always()
        shell: bash
        run: |
          MERGE_BASE=$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          node scripts/maintainability-trend.mjs --base "$MERGE_BASE" --head "${{ github.event.pull_request.head.sha }}" --at-ceiling > maintainability-trend.txt
          cat maintainability-trend.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload maintainability trend
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintainability-trend
          path: maintainability-trend.txt
          # error: a missing file means the measurement step silently wrote
          # nothing, and the trend must be present on every PR.
          if-no-files-found: error
      - name: Install Chromium for the isolated browser gate
        # Vitest browser mode renders the real component in headless Chromium;
        # install just that browser rather than every Playwright browser.
        run: npx playwright install chromium
      - name: Isolated real-SVAR browser gate
        # Covers production-scale render invariants and incremental sync behavior
        # against the real GanttContainer and SVAR components.
        run: npm run perf:isolated
      - name: SVAR probe gate (real components, real pointer)
        # Bar-visual and tooltip contracts proven by mounting the real SVAR
        # components in Chromium and driving real pointer events — the level
        # where three defects shipped past a fully green jest suite.
        run: npm run probe:svar
      - name: Upload perf trend (isolated)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-trend-isolated
          path: test/perf/.trend/isolated-latest.json
          if-no-files-found: ignore
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Bundle hygiene (no network/eval/base64 in dist/main.js)
        # The plugin is local-only: the released bundle must contain no network
        # calls, dynamic code execution, or base64 obscuring (scorecard R12). Use
        # the SAME masking-aware check release.yml runs — it strips the inlined
        # release-notes prose before matching, so legitimate notes text like
        # "fixed the fetch() retry" can't false-fail the gate.
        run: node scripts/check-bundle-hygiene.mjs

  e2e:
    # The gate itself lives in e2e.yml (workflow_call) so the repeat-run
    # measurement workflow executes the step-identical job. Required check
    # name: `e2e / e2e`.
    needs: build
    uses: ./.github/workflows/e2e.yml
